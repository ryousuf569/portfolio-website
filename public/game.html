const smokeParticles = [];
function spawnSmoke(wx, wy) {
  if (smokeParticles.length > 40) return;

    x: wx + 18 + Math.random() * 12,
    y: wy - 14,
    vx: (Math.random() - 0.5) * 0.2,

// ── Utilities ─────────────────────────────────────────────────────────────────
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);     ctx.arcTo(x + w, y,     x + w, y + r,     r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);     ctx.arcTo(x,     y + h, x,     y + h - r, r);
  ctx.lineTo(x, y + r);         ctx.arcTo(x,     y,     x + r, y,         r);
  ctx.closePath();
}

function darken(hex, f) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgb(${~~(r*f)},${~~(g*f)},${~~(b*f)})`;
}
function lighten(hex, f) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,~~(r*f))},${Math.min(255,~~(g*f))},${Math.min(255,~~(b*f))})`;
}

const FONT = "'Fredoka', 'Comic Sans MS', 'Comic Neue', sans-serif";

// ── Background ────────────────────────────────────────────────────────────────
function drawBackground() {
  // Night sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H * 0.4);
  grad.addColorStop(0, '#060810');
  grad.addColorStop(0.5, '#0c1020');
  grad.addColorStop(1, '#141830');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  // fill rest black
  ctx.fillStyle = '#060810';
  ctx.fillRect(0, H * 0.4, W, H * 0.6);

  const t = Date.now() * 0.001;
  stars.forEach(s => {
    const a = 0.2 + 0.6 * Math.sin(t * s.sp + s.phase);
    if (s.hue > 0) {
      ctx.fillStyle = `hsla(${s.hue}, 60%, 80%, ${a.toFixed(2)})`;
    } else {
      ctx.fillStyle = `rgba(255,255,240,${a.toFixed(2)})`;
    }
    ctx.fillRect(s.x % W, s.y, s.sz, s.sz);
  });
}

// ── Ground tiles ──────────────────────────────────────────────────────────────
function drawGround() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const t = MAP[r][c];
      if (t === 2) continue;

      if (t === 1) {
        // Road with proper edges
        ctx.fillStyle = C.road;
        ctx.fillRect(c*TILE, r*TILE, TILE, TILE);
        // Road edges (subtle curb line)
        ctx.fillStyle = C.roadShoulder;
        ctx.fillRect(c*TILE, r*TILE, TILE, 2);
        ctx.fillRect(c*TILE, r*TILE + TILE - 2, TILE, 2);
        // Center dashes
        if (c % 2 === 0) {
          ctx.fillStyle = C.roadDash;
          ctx.fillRect(c*TILE + 10, r*TILE + TILE/2 - 1.5, TILE - 20, 3);
        }
      } else if (t === 3) {
        // Sidewalk — concrete texture
        const base = (c + r) % 2 === 0 ? '#c8ccd2' : '#bec4ca';
        ctx.fillStyle = base;
        ctx.fillRect(c*TILE, r*TILE, TILE, TILE);
        // Sidewalk crack lines
        ctx.strokeStyle = '#aab0b8';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(c*TILE + TILE, r*TILE); ctx.lineTo(c*TILE + TILE, r*TILE + TILE);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(c*TILE, r*TILE + TILE); ctx.lineTo(c*TILE + TILE, r*TILE + TILE);
        ctx.stroke();
      } else {
        // Snow ground with subtle texture
        const noise = ((c * 7 + r * 13) % 3);
        const colors = [C.snow1, C.snow2, C.snow3];
        ctx.fillStyle = colors[noise];
        ctx.fillRect(c*TILE, r*TILE, TILE, TILE);
        // Snow clump details
        if ((c * 3 + r * 7) % 5 === 0) {
          ctx.fillStyle = 'rgba(255,255,255,0.4)';
          ctx.beginPath();
          ctx.arc(c*TILE + 20 + (c % 3) * 8, r*TILE + 16 + (r % 2) * 14, 4, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  }

  // Snowy border along road edges (snow pushed to sides)
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (MAP[r][c] !== 3) continue;
      // Check if next to road
      if (r > 0 && MAP[r-1][c] === 1) {
        ctx.fillStyle = 'rgba(220,230,240,0.5)';
        ctx.beginPath();
        ctx.ellipse(c*TILE + TILE/2, r*TILE + 3, TILE * 0.4, 4, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      if (r < ROWS-1 && MAP[r+1][c] === 1) {
        ctx.fillStyle = 'rgba(220,230,240,0.5)';
        ctx.beginPath();
        ctx.ellipse(c*TILE + TILE/2, r*TILE + TILE - 3, TILE * 0.4, 4, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
}

// ── Pine tree ─────────────────────────────────────────────────────────────────
function drawTree(x, y, sz) {
  const cx = x + sz / 2;
  const p = Math.max(2, Math.round(sz / 12)); // pixel unit

  // Snow on ground — blocky rectangles
  ctx.fillStyle = '#e4eaf4';
  ctx.fillRect(cx - p * 4, y + sz - p, p * 8, p);
  ctx.fillRect(cx - p * 3, y + sz, p * 6, p);

  // Trunk — blocky
  ctx.fillStyle = C.trunk;
  ctx.fillRect(cx - p, y + sz * 0.62, p * 2, sz * 0.38);
  ctx.fillStyle = C.trunkDk;
  ctx.fillRect(cx, y + sz * 0.66, p, sz * 0.28);

  // Top tier (darkest, narrowest) — stepped pyramid
  const t1y = y - p;
  ctx.fillStyle = C.pineDk;
  ctx.fillRect(cx - p,     t1y,         p * 2, p);
  ctx.fillRect(cx - p * 2, t1y + p,     p * 4, p);
  ctx.fillRect(cx - p * 3, t1y + p * 2, p * 6, p);
  // Snow cap on top tier
  ctx.fillStyle = '#eef2ff';
  ctx.fillRect(cx - p, t1y, p * 2, p);
  ctx.fillRect(cx - p * 2, t1y + p, p, p);

  // Middle tier — stepped wider
  const t2y = t1y + p * 3 + 1;
  ctx.fillStyle = C.pine;
  ctx.fillRect(cx - p * 2, t2y,         p * 4, p);
  ctx.fillRect(cx - p * 3, t2y + p,     p * 6, p);
  ctx.fillRect(cx - p * 4, t2y + p * 2, p * 8, p);
  // Snow highlight on middle
  ctx.fillStyle = '#eef2ff';
  ctx.fillRect(cx - p * 2, t2y, p * 2, p);

  // Bottom tier — widest
  const t3y = t2y + p * 3 + 1;
  ctx.fillStyle = C.pineLt;
  ctx.fillRect(cx - p * 3, t3y,         p * 6, p);
  ctx.fillRect(cx - p * 4, t3y + p,     p * 8, p);
  ctx.fillRect(cx - p * 5, t3y + p * 2, p * 10, p);
  // Snow highlight on bottom
  ctx.fillStyle = '#eef2ff';
  ctx.fillRect(cx - p * 3, t3y, p * 3, p);

  // Dark edge pixels for definition
  ctx.fillStyle = '#0a2a0a';
  ctx.fillRect(cx - p * 5, t3y + p * 2, p, p);
  ctx.fillRect(cx + p * 4, t3y + p * 2, p, p);
  ctx.fillRect(cx - p * 4, t2y + p * 2, p, p);
  ctx.fillRect(cx + p * 3, t2y + p * 2, p, p);
}

// ── Character sprite rendering ────────────────────────────────────────────────
function drawNpcSprite(img, tx, ty, label) {
  const sw = TILE + 4, sh = TILE + 14;
  const sx = tx + (TILE - sw) / 2;
  const sy = ty + TILE - sh;

  // Shadow
  ctx.save();
  ctx.translate(tx + TILE / 2, ty + TILE - 2);
  ctx.scale(1, 0.3);
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  if (img.complete && img.naturalWidth > 0) ctx.drawImage(img, sx, sy, sw, sh);

  // Wooden sign nameplate
  ctx.font = `bold 9px ${FONT}`;
  const bw = ctx.measureText(label).width + 14;
  const bx = tx + TILE / 2 - bw / 2;
  const by = ty + TILE - 14;
  // Post
  ctx.fillStyle = '#5a3218';
  ctx.fillRect(tx + TILE / 2 - 1.5, by + 11, 3, 8);
  // Sign board
  ctx.fillStyle = '#c4a46c'; ctx.strokeStyle = '#5a3218'; ctx.lineWidth = 1.5;
  rrect(bx, by, bw, 12, 2); ctx.fill(); ctx.stroke();
  // Wood grain line
  ctx.strokeStyle = 'rgba(90,50,24,0.3)'; ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.moveTo(bx + 3, by + 6); ctx.lineTo(bx + bw - 3, by + 6); ctx.stroke();
  // Text
  ctx.fillStyle = '#2a1000';
  ctx.textAlign = 'center';
  ctx.fillText(label, tx + TILE / 2, by + 9);
  ctx.textAlign = 'left';
}

function drawPlayerSprite(x, y, moving, walkPhase) {
  const sw = TILE + 4, sh = TILE + 14;
  const cx = x + TILE / 2;
  const cy = y + sh / 2 - 7;

  // Shadow
  ctx.save();
  ctx.translate(cx, y + TILE - 4);
  ctx.scale(1, 0.3);
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(cx, cy);
  if (moving) {
    const phase = walkPhase * 0.2;
    ctx.rotate(Math.sin(phase) * 0.08);
    ctx.translate(0, Math.abs(Math.sin(phase)) * -2.5);
  }
  ctx.translate(-sw / 2, -sh / 2);
  if (IMG_CARTMAN.complete && IMG_CARTMAN.naturalWidth > 0) {
    ctx.drawImage(IMG_CARTMAN, 0, 0, sw, sh);
  }
  ctx.restore();
}

// ── Building helpers ──────────────────────────────────────────────────────────

function drawSnowOnRoof(x, y, w) {
  ctx.fillStyle = 'rgba(230,236,248,0.8)';
  ctx.beginPath();
  ctx.moveTo(x - 2, y);
  ctx.quadraticCurveTo(x + w * 0.2, y - 5, x + w * 0.5, y - 3);
  ctx.quadraticCurveTo(x + w * 0.8, y - 6, x + w + 2, y);
  ctx.lineTo(x + w + 2, y + 3);
  ctx.lineTo(x - 2, y + 3);
  ctx.closePath();
  ctx.fill();
}

function drawWindowGlow(x, y, w, h) {
  ctx.fillStyle = '#ffe880';
  ctx.fillRect(x, y, w, h);
  // Warm glow
  ctx.fillStyle = 'rgba(255,220,100,0.15)';
  ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  // Window cross
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(x + w/2, y); ctx.lineTo(x + w/2, y + h);
  ctx.moveTo(x, y + h/2); ctx.lineTo(x + w, y + h/2);
  ctx.stroke();
}

function drawBuildingLabel(x, y, w, text, bgColor) {
  ctx.fillStyle = bgColor;
  rrect(x + 2, y, w - 4, 10, 2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 0.8;
  rrect(x + 2, y, w - 4, 10, 2); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = `bold 8px ${FONT}`;
  ctx.textAlign = 'center'; ctx.fillText(text, x + w / 2, y + 8); ctx.textAlign = 'left';
}

// ── Object renderers ──────────────────────────────────────────────────────────

// LinkedIn — tall office
function drawOfficeBuilding(x, y) {
  const bx = x + 6, by = y - 14, bw = 36, bh = 52;
  // Body with gradient feel
  ctx.fillStyle = '#1c3050';
  ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  ctx.fillRect(bx, by, bw / 2, bh);
  ctx.strokeStyle = '#0a1828'; ctx.lineWidth = 2;
  ctx.strokeRect(bx, by, bw, bh);
  // Roof
  ctx.fillStyle = '#0e1e30';
  ctx.fillRect(bx - 1, by, bw + 2, 5);
  drawSnowOnRoof(bx - 1, by, bw + 2);
  // Windows with glow
  for (let row = 0; row < 4; row++) {
    for (let col = 0; col < 3; col++) {
      drawWindowGlow(bx + 4 + col * 11, by + 9 + row * 9, 7, 5);
    }
  }
  // Door
  ctx.fillStyle = '#90d8ff';
  ctx.fillRect(bx + 12, by + bh - 12, 12, 12);
  ctx.strokeStyle = '#0a1828'; ctx.lineWidth = 1;
  ctx.strokeRect(bx + 12, by + bh - 12, 12, 12);
  // Label
  drawBuildingLabel(bx, by + bh + 2, bw, 'LinkedIn', '#0a66c2');
  // Chimney + smoke
  ctx.fillStyle = '#2a2a32';
  ctx.fillRect(bx + bw - 10, by - 8, 6, 10);
  spawnSmoke(bx + bw - 12, by - 6);
}

// GitHub — library
function drawLibrary(x, y) {
  const bx = x + 3, by = y - 10, bw = 42, bh = 46;
  // Body
  ctx.fillStyle = '#ddd4bc';
  ctx.fillRect(bx, by + 10, bw, bh - 10);
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fillRect(bx, by + 10, bw / 2, bh - 10);
  ctx.strokeStyle = '#8a7a5a'; ctx.lineWidth = 1.5;
  ctx.strokeRect(bx, by + 10, bw, bh - 10);
  // Pediment
  ctx.fillStyle = '#e8e0cc';
  ctx.beginPath(); ctx.moveTo(bx - 1, by + 10); ctx.lineTo(bx + bw / 2, by); ctx.lineTo(bx + bw + 1, by + 10); ctx.closePath();
  ctx.fill(); ctx.strokeStyle = '#8a7a5a'; ctx.lineWidth = 1.5; ctx.stroke();
  drawSnowOnRoof(bx, by, bw);
  // Columns
  for (const cx of [bx + 6, bx + 19, bx + 32]) {
    ctx.fillStyle = '#ede4cc';
    ctx.fillRect(cx, by + 10, 4, bh - 20);
    ctx.strokeStyle = '#a09070'; ctx.lineWidth = 0.8;
    ctx.strokeRect(cx, by + 10, 4, bh - 20);
    // Column caps
    ctx.fillStyle = '#d8d0b8';
    ctx.fillRect(cx - 1, by + 10, 6, 2);
    ctx.fillRect(cx - 1, by + bh - 12, 6, 2);
  }
  // Door
  ctx.fillStyle = '#3a2a18';
  ctx.fillRect(bx + 16, by + bh - 14, 10, 14);
  ctx.beginPath(); ctx.arc(bx + 21, by + bh - 14, 5, Math.PI, 0); ctx.fill();
  ctx.strokeStyle = '#1a1008'; ctx.lineWidth = 1;
  ctx.strokeRect(bx + 16, by + bh - 14, 10, 14);
  ctx.beginPath(); ctx.arc(bx + 21, by + bh - 14, 5, Math.PI, 0); ctx.stroke();
  // Label
  drawBuildingLabel(bx, by + bh + 2, bw, 'GitHub', '#24292e');
}

// Resume — school
function drawSchool(x, y) {
  const bx = x + 2, by = y - 8, bw = 44, bh = 44;
  // Body
  ctx.fillStyle = '#a04828';
  ctx.fillRect(bx, by + 10, bw, bh - 10);
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  ctx.fillRect(bx, by + 10, bw / 2, bh - 10);
  ctx.strokeStyle = '#6a2818'; ctx.lineWidth = 1.5;
  ctx.strokeRect(bx, by + 10, bw, bh - 10);
  // Tower
  ctx.fillStyle = '#8a3820';
  ctx.fillRect(bx + 16, by + 2, 12, 10);
  ctx.strokeStyle = '#5a2010'; ctx.lineWidth = 1; ctx.strokeRect(bx + 16, by + 2, 12, 10);
  // Roof peak
  ctx.fillStyle = '#6a2818';
  ctx.beginPath(); ctx.moveTo(bx + 15, by + 2); ctx.lineTo(bx + 22, by - 6); ctx.lineTo(bx + 29, by + 2); ctx.closePath();
  ctx.fill(); ctx.strokeStyle = '#4a1808'; ctx.lineWidth = 1; ctx.stroke();
  drawSnowOnRoof(bx, by + 10, bw);
  // Flag
  ctx.strokeStyle = '#888'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(bx + 22, by - 6); ctx.lineTo(bx + 22, by - 18); ctx.stroke();
  ctx.fillStyle = C.red;
  ctx.beginPath(); ctx.moveTo(bx + 22, by - 18); ctx.lineTo(bx + 29, by - 14.5); ctx.lineTo(bx + 22, by - 11); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#8a1010'; ctx.lineWidth = 0.8; ctx.stroke();
  // Windows with glow
  for (let i = 0; i < 4; i++) drawWindowGlow(bx + 3 + i * 11, by + 14, 6, 6);
  // Door
  ctx.fillStyle = '#4a2810';
  ctx.fillRect(bx + 17, by + bh - 12, 10, 12);
  ctx.strokeStyle = '#2a1008'; ctx.lineWidth = 1; ctx.strokeRect(bx + 17, by + bh - 12, 10, 12);
  // Label
  drawBuildingLabel(bx, by + bh + 2, bw, 'Résumé', '#4a5aa0');
}

// Generic project building
function drawBuilding(x, y, key) {
  if (key === 'LINKEDIN') { drawOfficeBuilding(x, y); return; }
  if (key === 'GITHUB')   { drawLibrary(x, y); return; }
  if (key === 'RESUME')   { drawSchool(x, y); return; }
  const color = BLDG_COLOR[key] || '#666';
  const bw = 42, bh = 48, bx = x + 3, by = y + 4;
  // Body with subtle shading
  ctx.fillStyle = color;
  ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fillRect(bx, by, bw / 2, bh);
  ctx.strokeStyle = darken(color, 0.5); ctx.lineWidth = 2;
  ctx.strokeRect(bx, by, bw, bh);
  // Roof
  ctx.fillStyle = darken(color, 0.55);
  ctx.fillRect(bx - 1, by, bw + 2, 6);
  ctx.strokeStyle = darken(color, 0.4); ctx.lineWidth = 1;
  ctx.strokeRect(bx - 1, by, bw + 2, 6);
  drawSnowOnRoof(bx - 1, by, bw + 2);
  // Windows with glow
  drawWindowGlow(bx + 5, by + 10, 10, 8);
  drawWindowGlow(bx + 27, by + 10, 10, 8);
  // Door
  ctx.fillStyle = darken(color, 0.35);
  ctx.fillRect(bx + 16, by + bh - 16, 10, 16);
  ctx.strokeStyle = darken(color, 0.25); ctx.lineWidth = 1;
  ctx.strokeRect(bx + 16, by + bh - 16, 10, 16);
  // Knob
  ctx.fillStyle = C.yellow;
  ctx.beginPath(); ctx.arc(bx + 24, by + bh - 8, 1.5, 0, Math.PI * 2); ctx.fill();
  // Chimney
  ctx.fillStyle = darken(color, 0.45);
  ctx.fillRect(bx + 6, by - 6, 5, 8);
  spawnSmoke(bx + 4, by - 4);
  // Label
  const short = { NBA_FANTASY:'NBA ML', MIDI_ME:'MIDI.me', SONARQL:'SonarQL', PRVN:'PRVN', PORTFOLIO_SITE:'Portfolio' };
  // White sign on building face
  ctx.fillStyle = C.warmWhite;
  rrect(bx + 3, by + bh - 28, bw - 6, 10, 1.5); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 0.8;
  rrect(bx + 3, by + bh - 28, bw - 6, 10, 1.5); ctx.stroke();
  ctx.fillStyle = darken(color, 0.5);
  ctx.font = `bold 8px ${FONT}`;
  ctx.textAlign = 'center'; ctx.fillText(short[key] || key, bx + bw / 2, by + bh - 20); ctx.textAlign = 'left';
}

// ── Streetlamps ───────────────────────────────────────────────────────────────
const LAMP_TILES = [[1,3],[6,3],[10,3],[14,3],[18,3],[1,6],[6,6],[10,6],[14,6],[18,6],[2,9],[7,9],[13,9],[17,9]];
function drawStreetlamp(tx, ty) {
  const cx = tx + TILE/2, baseY = ty + TILE;
  // Pole
  ctx.fillStyle = '#4a4a52';
  ctx.fillRect(cx - 1.5, baseY - 36, 3, 36);
  // Lamp head
  ctx.fillStyle = '#5a5a62';
  ctx.fillRect(cx - 5, baseY - 38, 10, 4);
  // Glow
  const t = Date.now() * 0.001;
  const flicker = 0.6 + 0.1 * Math.sin(t * 3 + tx);
  const grd = ctx.createRadialGradient(cx, baseY - 34, 0, cx, baseY - 34, 30);
  grd.addColorStop(0, `rgba(255,220,120,${(0.25 * flicker).toFixed(2)})`);
  grd.addColorStop(1, 'rgba(255,220,120,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(cx - 30, baseY - 60, 60, 50);
  // Bulb
  ctx.fillStyle = `rgba(255,240,180,${(0.9 * flicker).toFixed(2)})`;
  ctx.beginPath(); ctx.arc(cx, baseY - 35, 2.5, 0, Math.PI * 2); ctx.fill();
}

// ── Full-screen popup (About / Experience) ────────────────────────────────────
function drawFullPopup(data) {
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, W, H);

  const popW = Math.min(W * 0.9, W - 20);
  const popH = Math.min(H * 0.86, H - 20);
  const popX = (W - popW) / 2;
  const popY = (H - popH) / 2;

  // Drop shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  rrect(popX + 4, popY + 4, popW, popH, 10); ctx.fill();

  // Panel — parchment style
  const panelGrad = ctx.createLinearGradient(popX, popY, popX, popY + popH);
  panelGrad.addColorStop(0, '#faf6ee');
  panelGrad.addColorStop(1, '#f0eadc');
  ctx.fillStyle = panelGrad;
  rrect(popX, popY, popW, popH, 10); ctx.fill();
  ctx.strokeStyle = '#c0b090'; ctx.lineWidth = 2.5;
  rrect(popX, popY, popW, popH, 10); ctx.stroke();
  // Inner border
  ctx.strokeStyle = 'rgba(192,176,144,0.4)'; ctx.lineWidth = 1;
  rrect(popX + 4, popY + 4, popW - 8, popH - 8, 8); ctx.stroke();

  // Clip
  ctx.save();
  ctx.beginPath(); ctx.rect(popX, popY, popW, popH); ctx.clip();

  const pad = Math.round(W * 0.03);
  const titleH = Math.round(H * 0.11);
  const titleFont = Math.max(14, Math.round(H * 0.065));
  const bodyFont = Math.max(12, Math.round(H * 0.052));
  const lineGap = Math.round(H * 0.082);

  function wrapText(text, maxW) {
    const words = text.split(' ');
    const lines = []; let cur = '';
    words.forEach(w => {
      const test = cur ? cur + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; }
      else cur = test;
    });
    if (cur) lines.push(cur);
    return lines;
  }

  if (data._key === 'ABOUT') {
    const imgSize = Math.min(popH - pad * 2, popW * 0.38);
    const imgX = popX + pad, imgY = popY + pad;
    // Photo frame
    ctx.fillStyle = '#e4eaf0'; ctx.strokeStyle = '#a09070'; ctx.lineWidth = 2;
    rrect(imgX - 2, imgY - 2, imgSize + 4, imgSize + 4, 4); ctx.fill(); ctx.stroke();
    if (IMG_PHOTO.complete && IMG_PHOTO.naturalWidth > 0) {
      ctx.save();
      ctx.beginPath(); rrect(imgX, imgY, imgSize, imgSize, 3); ctx.clip();
      const iw = IMG_PHOTO.naturalWidth, ih = IMG_PHOTO.naturalHeight;
      const scale = Math.max(imgSize / iw, imgSize / ih);
      const dw = iw * scale, dh = ih * scale;
      ctx.drawImage(IMG_PHOTO, imgX + (imgSize - dw) / 2, imgY + (imgSize - dh) / 2, dw, dh);
      ctx.restore();
    }

    const tx = imgX + imgSize + pad;
    const tw = popX + popW - tx - pad;

    // Title bar
    const titleGrad = ctx.createLinearGradient(tx, popY + pad, tx + tw, popY + pad);
    titleGrad.addColorStop(0, C.uiTitle);
    titleGrad.addColorStop(1, '#5a6aa0');
    ctx.fillStyle = titleGrad;
    rrect(tx, popY + pad, tw, titleH, 5); ctx.fill();
    ctx.strokeStyle = '#2a3460'; ctx.lineWidth = 1.5;
    rrect(tx, popY + pad, tw, titleH, 5); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${titleFont}px ${FONT}`;
    ctx.fillText(data.title, tx + 8, popY + pad + titleH * 0.7);

    ctx.fillStyle = '#3a3020';
    ctx.font = `${bodyFont}px ${FONT}`;
    let lineY = popY + pad + titleH + lineGap * 0.6;
    data.lines.forEach(l => {
      wrapText(l, tw - 14).forEach(wl => {
        ctx.fillText(wl, tx + 8, lineY);
        lineY += lineGap;
      });
    });

  } else {
    // Title bar centered
    const titleGrad = ctx.createLinearGradient(popX + pad, popY + pad, popX + popW - pad, popY + pad);
    titleGrad.addColorStop(0, C.uiTitle);
    titleGrad.addColorStop(1, '#5a6aa0');
    ctx.fillStyle = titleGrad;
    rrect(popX + pad, popY + pad, popW - pad * 2, titleH, 5); ctx.fill();
    ctx.strokeStyle = '#2a3460'; ctx.lineWidth = 1.5;
    rrect(popX + pad, popY + pad, popW - pad * 2, titleH, 5); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${titleFont}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.fillText(data.title, W / 2, popY + pad + titleH * 0.7);
    ctx.textAlign = 'left';

    ctx.fillStyle = '#3a3020';
    ctx.font = `${bodyFont}px ${FONT}`;
    const maxTW = popW - pad * 2 - 16;
    let lineY = popY + pad + titleH + lineGap * 0.7;
    data.lines.forEach(l => {
      wrapText('• ' + l, maxTW).forEach(wl => {
        ctx.fillText(wl, popX + pad + 8, lineY);
        lineY += lineGap;
      });
    });
  }

  ctx.restore();

  // Close hint
  const smallFont = Math.max(11, Math.round(H * 0.04));
  ctx.fillStyle = '#a09070'; ctx.font = `${smallFont}px ${FONT}`;
  ctx.textAlign = 'right';
  ctx.fillText('B / ESC to close', popX + popW - 12, popY + popH - 8);
  ctx.textAlign = 'left';
}

// ── Dialog box ────────────────────────────────────────────────────────────────
function drawDialog(data) {
  const dh = Math.round(H * 0.42);
  const dw = Math.min(W * 0.82, W - 30);
  const dx = (W - dw) / 2;
  const dy = (H - dh) / 2;

  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);

  // Drop shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  rrect(dx + 3, dy + 3, dw, dh, 8); ctx.fill();

  // Panel
  const panelGrad = ctx.createLinearGradient(dx, dy, dx, dy + dh);
  panelGrad.addColorStop(0, '#faf6ee');
  panelGrad.addColorStop(1, '#f0eadc');
  ctx.fillStyle = panelGrad;
  rrect(dx, dy, dw, dh, 8); ctx.fill();
  ctx.strokeStyle = '#c0b090'; ctx.lineWidth = 2;
  rrect(dx, dy, dw, dh, 8); ctx.stroke();

  // Portrait
  const ps = Math.round(dh * 0.6), portX = dx + 10, portY = dy + Math.round(dh * 0.18);
  ctx.fillStyle = '#e4eaf0'; ctx.strokeStyle = '#a09070'; ctx.lineWidth = 1.5;
  rrect(portX - 1, portY - 1, ps + 2, ps + 2, 3); ctx.fill(); ctx.stroke();
  ctx.save();
  ctx.beginPath(); ctx.rect(portX, portY, ps, ps); ctx.clip();
  const portraitImg = data._key === 'ABOUT' ? IMG_STAN : data._key === 'EXPERIENCE' ? IMG_KYLE : null;
  if (portraitImg && portraitImg.complete && portraitImg.naturalWidth > 0) {
    ctx.drawImage(portraitImg, portX, portY, ps, ps);
  } else if (!portraitImg) {
    // Building icon for non-NPC dialogs
    ctx.fillStyle = BLDG_COLOR[data._key] || '#888';
    ctx.fillRect(portX + ps*0.2, portY + ps*0.25, ps*0.6, ps*0.55);
    ctx.fillStyle = '#ffe880';
    ctx.fillRect(portX + ps*0.3, portY + ps*0.35, ps*0.15, ps*0.12);
    ctx.fillRect(portX + ps*0.55, portY + ps*0.35, ps*0.15, ps*0.12);
  }
  ctx.restore();

  const titleFont = Math.max(14, Math.round(H * 0.058));
  const bodyFont = Math.max(12, Math.round(H * 0.048));
  const linkFont = Math.max(11, Math.round(H * 0.042));
  const dlLineGap = Math.round(H * 0.072);

  const tx = portX + ps + 14, tw = dw - ps - 38;
  const titleBarH = Math.round(dh * 0.16);

  // Title bar
  const tGrad = ctx.createLinearGradient(tx, dy + 10, tx + tw, dy + 10);
  tGrad.addColorStop(0, C.uiTitle);
  tGrad.addColorStop(1, '#5a6aa0');
  ctx.fillStyle = tGrad;
  rrect(tx, dy + 10, tw, titleBarH, 4); ctx.fill();
  ctx.strokeStyle = '#2a3460'; ctx.lineWidth = 1;
  rrect(tx, dy + 10, tw, titleBarH, 4); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${titleFont}px ${FONT}`;
  ctx.fillText(data.title, tx + 8, dy + 10 + titleBarH * 0.7);

  ctx.fillStyle = '#3a3020';
  ctx.font = `${bodyFont}px ${FONT}`;
  data.lines.forEach((l, i) => ctx.fillText(l, tx + 8, dy + 10 + titleBarH + dlLineGap * 0.6 + i * dlLineGap));

  if (data.link) {
    ctx.fillStyle = '#b83030';
    ctx.font = `bold ${linkFont}px ${FONT}`;
    ctx.fillText('[ C / ENTER — open link ]', tx + 8, dy + dh - 12);
  }
  ctx.fillStyle = '#a09070';
  ctx.font = `${linkFont}px ${FONT}`;
  ctx.textAlign = 'right'; ctx.fillText('B / ESC to close', dx + dw - 10, dy + dh - 10); ctx.textAlign = 'left';
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function drawHUD() {
  const hudFont = Math.max(12, Math.round(H * 0.048));
  const hudSmall = Math.max(11, Math.round(H * 0.04));

  // Location badge — top left
  const locW = W * 0.38;
  const locH = hudFont + 16;
  ctx.fillStyle = 'rgba(15,18,28,0.75)';
  rrect(10, 10, locW, locH, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(90,106,170,0.4)'; ctx.lineWidth = 1;
  rrect(10, 10, locW, locH, 6); ctx.stroke();
  // Location dot
  ctx.fillStyle = '#4a8';
  ctx.beginPath(); ctx.arc(22, 10 + locH / 2, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e8e4d8';
  ctx.font = `bold ${hudFont}px ${FONT}`;
  ctx.fillText('South Park, CO', 30, 10 + hudFont + 2);

  // Controls hint — bottom left
  const hintH = hudSmall + 12;
  const hintW = W * 0.56;
  ctx.fillStyle = 'rgba(15,18,28,0.6)';
  rrect(10, H - hintH - 10, hintW, hintH, 5); ctx.fill();
  ctx.fillStyle = '#b0a890';
  ctx.font = `${hudSmall}px ${FONT}`;
  ctx.fillText('D-pad: Move  |  A: Talk  |  B: Close  |  C: Link', 18, H - 16);
}

// ── Game state ────────────────────────────────────────────────────────────────
let px = 5 * TILE, py = 2.5 * TILE;
let vx = 0, vy = 0, dir = 'down', dialogData = null;
let walkPhase = 0, isMoving = false;
const keys = {};
let frameCount = 0;

window.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys[e.key] = true;
  if (e.key === ' ') {
    const o = nearbyObj();
    if (o) dialogData = { ...PORTFOLIO[o[3]], _key: o[3] };
  }
  if ((e.key === 'Enter' || e.key === 'c' || e.key === 'C') && dialogData && dialogData.link) window.open(dialogData.link, '_blank');
  if (e.key === 'Escape' && dialogData) dialogData = null;
});
window.addEventListener('keyup',  e => { keys[e.key] = false; });
window.addEventListener('blur',   () => { for (const k in keys) delete keys[k]; });

function walkable(c, r) { return r >= 0 && r < ROWS && c >= 0 && c < COLS && !BLOCKED.has(`${c},${r}`); }
function canMoveTo(wx, wy) {
  const cx = wx + TILE / 2, cy = wy + TILE * 0.8;
  return walkable(Math.floor(cx / TILE), Math.floor(cy / TILE));
}
function nearbyObj() {
  const pc = Math.floor((px + 24) / TILE), pr = Math.floor((py + 32) / TILE);
  const facing = { left:[-1,0], right:[1,0], up:[0,-1], down:[0,1] }[dir];
  const allDirs = [facing, [-1,0],[1,0],[0,-1],[0,1]];
  for (const [dc, dr] of allDirs) {
    const o = OBJECTS.find(o => o[0] === pc + dc && o[1] === pr + dr);
    if (o) return o;
  }
  return null;
}

function drawInteractHint(obj) {
  const label = obj[2] === 'npc' ? 'Space/A to talk' : 'Space/A to enter';
  const tx = obj[0] * TILE, ty = obj[1] * TILE;
  ctx.font = `bold 9px ${FONT}`;
  const tw = ctx.measureText(label).width + 14;
  const hx = tx + TILE / 2 - tw / 2;
  // Bobbing animation
  const bob = Math.sin(Date.now() * 0.004) * 2;
  const hy = ty - 28 + bob;
  // Bubble with warm parchment style
  ctx.fillStyle = '#faf4e0'; ctx.strokeStyle = '#c0a860'; ctx.lineWidth = 1.5;
  rrect(hx, hy, tw, 14, 4); ctx.fill(); ctx.stroke();
  // Tail
  ctx.fillStyle = '#faf4e0';
  ctx.beginPath();
  ctx.moveTo(tx + TILE / 2 - 3, hy + 14);
  ctx.lineTo(tx + TILE / 2 + 3, hy + 14);
  ctx.lineTo(tx + TILE / 2, hy + 19);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#c0a860'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(tx + TILE / 2 - 3, hy + 14);
  ctx.lineTo(tx + TILE / 2, hy + 19);
  ctx.lineTo(tx + TILE / 2 + 3, hy + 14);
  ctx.stroke();
  // Text
  ctx.fillStyle = '#4a3820'; ctx.textAlign = 'center';
  ctx.fillText(label, tx + TILE / 2, hy + 10.5);
  ctx.textAlign = 'left';
}

// ── Main loop ─────────────────────────────────────────────────────────────────
function loop() {
  frameCount++;

  // Snow physics
  const t = Date.now() * 0.001;
  snowflakes.forEach(s => {
    s.y += s.sp;
    s.x += s.dr + Math.sin(t + s.wobble) * s.wobbleAmp * 0.3;
    if (s.y > H + 10) { s.y = -10; s.x = Math.random() * W; }
    if (s.x > W + 10) s.x = -10;
    if (s.x < -10)    s.x = W + 10;
  });

  // Smoke physics
  for (let i = smokeParticles.length - 1; i >= 0; i--) {
    const p = smokeParticles[i];
    p.x += p.vx; p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) smokeParticles.splice(i, 1);
  }

  if (!dialogData) {
    vx = 0; vy = 0;
    if      (keys.ArrowLeft  || keys.a) { vx = -3; dir = 'left'; }
    else if (keys.ArrowRight || keys.d) { vx =  3; dir = 'right'; }
    if      (keys.ArrowUp    || keys.w) { vy = -3; dir = 'up'; }
    else if (keys.ArrowDown  || keys.s) { vy =  3; dir = 'down'; }
    if (canMoveTo(px + vx, py)) px += vx;
    if (canMoveTo(px, py + vy)) py += vy;
  }

  isMoving = (vx !== 0 || vy !== 0);
  if (isMoving) walkPhase++;

  drawBackground();

  // World
  ctx.save();
  ctx.translate(W / 2 - (px + 24) * WORLD_SCALE, H / 2 - (py + 32) * WORLD_SCALE);
  ctx.scale(WORLD_SCALE, WORLD_SCALE);

  drawGround();

  // Streetlamps (behind trees and buildings)
  LAMP_TILES.forEach(([tc, tr]) => drawStreetlamp(tc * TILE, tr * TILE));

  TREE_TILES.forEach(([tc, tr]) => {
    if (!BLOCKED.has(`${tc},${tr}`)) drawTree(tc * TILE, tr * TILE, TILE);
  });

  OBJECTS.forEach(o => {
    if (o[2] === 'npc') {
      const img = o[3] === 'ABOUT' ? IMG_STAN : IMG_KYLE;
      const label = o[3] === 'ABOUT' ? 'About' : 'Experience';
      drawNpcSprite(img, o[0] * TILE, o[1] * TILE, label);
    } else {
      drawBuilding(o[0] * TILE, o[1] * TILE, o[3]);
    }
  });

  // Smoke in world space
  smokeParticles.forEach(p => {
    ctx.fillStyle = `rgba(180,180,190,${(p.life * 0.35).toFixed(2)})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.sz * (1.5 - p.life * 0.5), 0, Math.PI * 2); ctx.fill();
  });

  if (!dialogData) {
    const hint = nearbyObj();
    if (hint) drawInteractHint(hint);
  }

  drawPlayerSprite(px, py, isMoving, walkPhase);

  ctx.restore();

  // Snow (screen space) — varied opacity
  snowflakes.forEach(s => {
    const a = 0.4 + 0.35 * Math.sin(t * 0.5 + s.wobble);
    ctx.fillStyle = `rgba(255,255,255,${a.toFixed(2)})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  });

  if (dialogData) {
    if (dialogData._key === 'ABOUT' || dialogData._key === 'EXPERIENCE') {
      drawFullPopup(dialogData);
    } else {
      drawDialog(dialogData);
    }
  }
  drawHUD();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
